services:
  postgres:
    image: postgres:16.6
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blockchain_tracker


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - blockchain_tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DEBUG: ${BACKEND__DEBUG}
      STATE: ${BACKEND__STATE}
      TCP_PORT: ${BACKEND__TCP_PORT}
      SECRET_KEY: ${BACKEND__SECRET_KEY}
      DATABASE__URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BROKER__URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      AUTHENTICATION__ACCESS_TOKEN__SECRET_KEY: ${BACKEND__AUTHENTICATION_ACCESS_TOKEN_SECRET_KEY}
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "${BACKEND__TCP_PORT}:${BACKEND__TCP_PORT}"
    networks:
      - blockchain_tracker

  worker_blockchair:
    build:
      context: ./workers/blockchair
      dockerfile: Dockerfile
    container_name: worker_1
    restart: unless-stopped
    depends_on:
      - backend
      - rabbitmq
    environment:
      BROKER_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      TIMEOUT: ${WORKER_BLOCKCHAIR__TIMEOUT}
      PROXY: ${WORKER_BLOCKCHAIR__PROXY}
    networks:
      - blockchain_tracker

  worker_coinmarketcap:
    build:
      context: ./workers/coinmarketcap
      dockerfile: Dockerfile
    container_name: worker_2
    restart: unless-stopped
    depends_on:
      - backend
      - rabbitmq
    environment:
      BROKER_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      TIMEOUT: ${WORKER_COINMARKETCAP__TIMEOUT}
    networks:
      - blockchain_tracker

volumes:
  postgres_data:
  rabbitmq_data:
  static_volume:
    driver: local

networks:
  blockchain_tracker:
    driver: bridge
